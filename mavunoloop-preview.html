<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MavunoLoop – Sell before it spoils</title>
  <meta name="description" content="MavunoLoop connects Kenyan farmers, buyers and cooperatives for produce and farm residues.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&family=Public+Sans:wght@400;600&display=swap">
  <style>
/* MavunoLoop styles – deep green brand, warm neutrals, amber only for urgency */
:root{--bg:#f5f2ea;--card:#fff;--ink:#1b2a1f;--muted:#5f6d63;--green:#1f6a3a;--green-dark:#154a29;--green-soft:#e2efe4;--line:#e0dccd;
  --yellow:#f8e9b0;--orange:#f7cfa4;--red:#f3bbb4;--blue:#d3e3f2;--grey:#e8e5da;--shadow:0 1px 2px #1b2a1f14,0 4px 14px #1b2a1f0d;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 'Public Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Bitter,Georgia,serif;line-height:1.25;margin:.3em 0 .5em;color:var(--green-dark)}
h1{font-size:clamp(1.7rem,4vw,2.3rem)}h2{font-size:1.4rem;margin-top:2em}h3{font-size:1.1rem}
a{color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px}
.muted{color:var(--muted);font-size:.92rem}
/* ---- header ---- */
#top{background:var(--green-dark);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
#top .bar{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
#top .logo{font:800 1.25rem Bitter,serif;color:#fff;text-decoration:none;white-space:nowrap}
#top nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#top nav::-webkit-scrollbar{display:none}
#top nav a,#top .out{color:#ffffffd9;text-decoration:none;font-weight:600;font-size:.95rem;padding:8px 12px;border-radius:99px;white-space:nowrap}
#top nav a:hover,#top .out:hover{background:#ffffff1f;color:#fff}
#top nav a.on{background:#fff;color:var(--green-dark)}
.who{font-size:.8rem;background:#ffffff26;border-radius:99px;padding:3px 12px;white-space:nowrap}
/* ---- forms & buttons ---- */
label{display:block;font-weight:600;margin:14px 0 5px;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px #1f6a3a26}
.btn{display:inline-block;font:700 1rem 'Public Sans',sans-serif;padding:12px 20px;min-height:46px;border-radius:10px;border:2px solid var(--green);background:var(--green);color:#fff;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0;transition:background .15s}
.btn:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn.alt{background:#fff;color:var(--green)}.btn.alt:hover{background:var(--green-soft)}
.btn.small{padding:6px 14px;min-height:36px;font-size:.9rem}.btn.danger{background:#a33a2f;border-color:#a33a2f;color:#fff}
.btn.light{background:#fff;color:var(--green-dark);border-color:#fff}.btn.ghost{background:transparent;color:#fff;border-color:#ffffffb0}
:focus-visible{outline:3px solid #e0a800;outline-offset:2px}
.error{color:#a33a2f;font-weight:600;min-height:1.2em}
/* ---- layout ---- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:14px}.row>*{flex:1 1 160px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
a.card{display:block;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #1b2a1f1f}
a.card[data-st=ATTENTION]{border-top:5px solid #e3b93b}a.card[data-st=AT_RISK]{border-top:5px solid #e07b24}
a.card[data-st=FRESH],a.card[data-st=AVAILABLE]{border-top:5px solid var(--green)}a.card[data-st=ALTERNATIVE_LISTING]{border-top:5px solid #5b8fc4}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font:800 2.3rem Bitter,serif;color:var(--green);line-height:1.1}
/* hero + role cards */
.hero{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;border-radius:20px;padding:34px 26px;margin:6px 0 6px}
.hero h1{color:#fff;font-size:clamp(1.9rem,5vw,2.8rem);max-width:18ch}.hero p{max-width:55ch;font-size:1.1rem;color:#e6f2e8}
.hero label{color:#fff}.hero .search{display:flex;gap:10px;flex-wrap:wrap}.hero .search input{flex:3 1 260px;border:none}.hero .search .btn{flex:1 1 120px;margin:0}
.role .ico{font-size:2.2rem;display:block;margin-bottom:4px}
.step{display:flex;gap:12px;align-items:flex-start}.step i{flex:0 0 38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font:700 1rem Bitter,serif;font-style:normal}
.thumb{height:120px;border-radius:10px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:3.2rem;margin-bottom:10px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;padding:2px 11px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--grey);color:var(--ink)}
.b-green{background:var(--green-soft)}.b-yellow{background:var(--yellow)}.b-orange{background:var(--orange)}.b-red{background:var(--red)}.b-blue{background:var(--blue)}
.note{border-left:5px solid var(--green);background:var(--green-soft);padding:12px 16px;border-radius:10px;margin:14px 0}
.note.warn{border-color:#c0392b;background:var(--red)}
.unread{border-left:5px solid var(--green)}
.auth{max-width:440px;margin:28px auto;padding:26px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
th{background:var(--green-soft);font-size:.85rem}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:.93rem}
.scroll{overflow-x:auto}
details.tools{margin-top:30px;border:2px dashed #b8860b;border-radius:12px;padding:12px 16px;background:#fbf3d3}
canvas{max-width:100%;border-radius:12px;box-shadow:var(--shadow)}
/* USSD phone */
.phone{max-width:300px;margin:0 auto;background:#1c1c1e;border-radius:34px;padding:22px 18px;box-shadow:0 12px 30px #0004}

.phone input{margin-top:12px;text-align:center;font-size:1.2rem;letter-spacing:2px}.phone .btn{width:100%;margin:8px 0 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2a1f;color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:9;max-width:90%;box-shadow:var(--shadow)}
footer{padding-bottom:40px}
@media(max-width:600px){.hero{padding:26px 18px;border-radius:16px}.wrap{padding:12px}}

.hero.slim{min-height:0;padding:22px 26px}.hero.slim h1{margin:0 0 .2em}.hero.slim p{margin:0}

/* ---- SMS bubble ---- */

/* ---- chat ---- */
.chat-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:none;border-radius:99px;background:var(--green);color:#fff;font:700 1rem 'Public Sans',sans-serif;padding:14px 20px;cursor:pointer;box-shadow:0 6px 18px #0004}
.chat-panel{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:21;width:380px;max-width:calc(100vw - 24px);height:min(600px,78vh);background:#fff;border-radius:18px;box-shadow:0 12px 40px #0005;display:flex;flex-direction:column;overflow:hidden}

.chat-head button{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer}
.chat-note{font-size:.78rem;color:var(--muted);padding:6px 14px;background:var(--green-soft)}
#chatLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:.95rem;line-height:1.45}
.msg.bot{background:var(--green-soft);align-self:flex-start;border-bottom-left-radius:4px}.msg.me{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg ul{margin:.3em 0;padding-left:1.1em}.msg a{color:var(--green-dark);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}.chips button{border:1.5px solid var(--green);background:#fff;color:var(--green-dark);border-radius:99px;padding:5px 11px;font:600 .8rem 'Public Sans',sans-serif;cursor:pointer}
#chatForm{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}#chatForm input{flex:1}#chatForm .btn{margin:0;padding:8px 16px}
.phone .nav{display:flex;gap:6px;margin-top:8px}.phone .nav .btn{margin:0;padding:6px 4px;min-height:36px;font-size:.85rem}.phone .btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- chat: calmer layout (help shows on hover/tap) ---- */
.chat-panel{height:min(480px,75vh);width:360px}
.chat-head{gap:8px}.chat-head>b{flex:1}
.tip{position:relative}.tip button{font-size:1rem}
.tip-text{display:none;position:absolute;top:130%;right:-40px;width:230px;background:#1b2a1f;color:#fff;font-size:.8rem;line-height:1.4;padding:9px 11px;border-radius:10px;z-index:3}
.tip:hover .tip-text,.tip:focus-within .tip-text{display:block}
.ex{position:relative;display:flex}.ex-btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;font-size:1.1rem;cursor:pointer}
.ex-pop{display:none;position:absolute;bottom:calc(100% + 8px);left:0;width:270px;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px #0003}
.ex:hover .ex-pop,.ex:focus-within .ex-pop{display:flex}.ex-pop button{text-align:left;border:1.5px solid var(--green);background:#fff;color:var(--green-dark);border-radius:10px;padding:6px 10px;font:600 .82rem 'Public Sans',sans-serif;cursor:pointer}
.ex-pop button:hover{background:var(--green-soft)}

/* ---- floating live background ---- */
.floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaters span{position:absolute;bottom:-60px;left:var(--x);font-size:var(--s);opacity:.2;animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(32px,-60vh) rotate(25deg)}100%{transform:translate(-22px,-120vh) rotate(-15deg)}}
main,footer{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){.floaters{display:none}}

</style>

  <footer class="wrap muted">MavunoLoop · Hackathon MVP · Demo data is illustrative. Freshness warnings are estimates, not confirmed spoilage.</footer>

  <!-- Load order matters: each file adds to the global ML object -->
  <script>
/* data.js – constants, reviewed catalogue and sample data. Everything hangs off the global ML object. */
window.ML = { pages: {}, act: {} };

ML.PLACES = ['Eldoret', 'Kitale', 'Nakuru', 'Kericho', 'Nyeri', 'Kisumu', 'Nairobi', 'Thika', 'Meru', 'Bungoma'];

// ILLUSTRATIVE shelf-life estimates in days (ambient storage). Must be validated with agricultural guidance.
ML.SHELF = { tomato: 7, kale: 4, cabbage: 14, mango: 7, banana: 7, avocado: 8, potato: 30, onion: 30, maize: 60, beans: 90 };
ML.STORAGE_FACTOR = { cool: 1.5, ambient: 1, sun: 0.6 };
ML.STORAGE_LABEL = { cool: 'Cool / shaded store', ambient: 'Ambient (room)', sun: 'Open sun' };

ML.ALIAS = { // English + Swahili words recognised in search and the listing assistant
  tomato: ['tomato', 'tomatoes', 'nyanya'], maize: ['maize', 'mahindi', 'corn'], kale: ['kale', 'sukuma'],
  beans: ['beans', 'bean', 'maharagwe'], potato: ['potato', 'potatoes', 'viazi'], onion: ['onion', 'onions', 'vitunguu'],
  cabbage: ['cabbage', 'kabichi'], mango: ['mango', 'mangoes', 'embe'], banana: ['banana', 'bananas', 'ndizi'],
  avocado: ['avocado', 'avocados', 'parachichi'] };
ML.EMOJI = { tomato: '🍅', maize: '🌽', kale: '🥬', beans: '🫘', potato: '🥔', onion: '🧅', cabbage: '🥬', mango: '🥭', banana: '🍌', avocado: '🥑' };

// Listing status -> [label, badge class]
ML.STATUS = {
  FRESH: ['Fresh', 'b-green'], ATTENTION: ['Approaching window (est.)', 'b-yellow'], AT_RISK: ['At risk (est.)', 'b-orange'],
  URGENT_REVIEW: ['Urgent review', 'b-red'], SOLD: ['Sold', ''], WITHDRAWN: ['Withdrawn', ''],
  ALTERNATIVE_REVIEW: ['Alternative review', 'b-blue'], ALTERNATIVE_LISTING: ['Alternative use', 'b-blue'], AVAILABLE: ['Available', 'b-green'] };

// Allowed status transitions
ML.TRANSITIONS = {
  FRESH: ['ATTENTION', 'AT_RISK', 'URGENT_REVIEW', 'SOLD', 'WITHDRAWN'],
  ATTENTION: ['FRESH', 'AT_RISK', 'URGENT_REVIEW', 'SOLD', 'WITHDRAWN'],
  AT_RISK: ['FRESH', 'URGENT_REVIEW', 'SOLD', 'WITHDRAWN'],
  URGENT_REVIEW: ['FRESH', 'SOLD', 'WITHDRAWN', 'ALTERNATIVE_REVIEW'],
  ALTERNATIVE_REVIEW: ['ALTERNATIVE_LISTING', 'WITHDRAWN'],
  ALTERNATIVE_LISTING: ['SOLD', 'WITHDRAWN'], AVAILABLE: ['SOLD', 'WITHDRAWN'], SOLD: [], WITHDRAWN: [] };
ML.RISK_ORDER = { FRESH: 0, ATTENTION: 1, AT_RISK: 2, URGENT_REVIEW: 3 };

// Small reviewed catalogue of alternative uses (illustrative). Deteriorated produce is NEVER suggested for food or feed.
ML.CATALOGUE = {
  'maize stalks': [['Dry roughage for livestock', 'Only if dry, mould-free and chemical-free'], ['Mulch or compost input', 'Low risk'], ['Briquette / fuel feedstock', 'Check local rules']],
  'maize husks': [['Mulch or compost input', 'Low risk'], ['Craft or fuel use', 'Low risk']],
  'bean stalks': [['Compost input', 'Low risk'], ['Dry fodder', 'Only if clean, dry and mould-free']],
  'deteriorated produce': [['Compost input', 'NOT for food or animal feed'], ['Biogas digester feedstock', 'NOT for food or feed; needs a buyer with a digester']] };

// Sample data (illustrative). Demo accounts are NOT secure authentication.
ML.seed = function () {
  const n = Date.now(), ago = (d) => new Date(n - d * 864e5).toISOString();
  const L = (id, sel, type, crop, title, q, u, p, loc, harvestDaysAgo, st, stg, extra) => Object.assign({
    id, sel, type, crop, title, q, u, p, loc, h: harvestDaysAgo == null ? null : ago(harvestDaysAgo), stg, cond: 'good', st,
    avail: 'This week', upd: ago(0.2), created: ago(2), draft: false, hidden: false, reported: false, cc: 0, img: null }, extra || {});
  return {
    clock: 0, session: null,
    users: [
      { id: 'u1', role: 'farmer', name: 'Wanjiku Kiprono', email: 'farmer@mavunoloop.demo', pass: 'farmer123', phone: '0700 000 001', loc: 'Eldoret' },
      { id: 'u2', role: 'farmer', name: 'Otieno Barasa', email: 'otieno@mavunoloop.demo', pass: 'farmer123', phone: '0700 000 002', loc: 'Kitale' },
      { id: 'b1', role: 'buyer', name: 'Amina Chebet', org: 'Chebet Fresh Traders', email: 'buyer@mavunoloop.demo', pass: 'buyer123', phone: '0700 000 003', loc: 'Eldoret' },
      { id: 'a1', role: 'admin', name: 'Uasin Gishu Farmers Cooperative Board', email: 'board@mavunoloop.demo', pass: 'board123', loc: 'Eldoret' } ],
    listings: [
      L('l1', 'u1', 'produce', 'tomato', 'Tomatoes – Eldoret', 120, 'kg', 60, 'Eldoret', 1, 'FRESH', 'ambient'),
      L('l2', 'u1', 'produce', 'tomato', 'Tomatoes – sell soon', 80, 'kg', 45, 'Eldoret', 6, 'AT_RISK', 'ambient'),

      L('l5', 'u2', 'produce', 'kale', 'Sukuma wiki (kale)', 40, 'kg', 50, 'Kitale', 2, 'FRESH', 'ambient'),
      L('l6', 'u2', 'residue', 'bean stalks', 'Bean stalks', 500, 'kg', 4, 'Kitale', null, 'AVAILABLE', 'ambient', { intended: 'Compost' }) ],
    notifs: [], history: [],
    enquiries: [{ id: 'e0', lid: 'l1', buyerId: 'b1', buyerName: 'Amina Chebet', qty: 50, msg: 'Sample: I need 50 kg of tomatoes this week.', status: 'new', at: ago(0.5) }] };
};

</script>
  <script>
/* store.js – app state, local persistence, demo login, notifications, status changes. */
ML.KEY = 'mavunoloop.v2';
ML.DAY = 864e5;

ML.load = function () { try { return JSON.parse(localStorage.getItem(ML.KEY)) || ML.seed(); } catch (e) { return ML.seed(); } };
ML.save = function () { try { localStorage.setItem(ML.KEY, JSON.stringify(ML.S)); } catch (e) { ML.toast('Could not save locally (storage full?)'); } };
ML.reset = function () { ML.S = ML.seed(); ML.save(); };
ML.S = ML.load();

ML.now = () => Date.now() + ML.S.clock * ML.DAY;           // simulated clock (used by demo tools)
ML.iso = () => new Date(ML.now()).toISOString();
ML.uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
ML.user = (id) => ML.S.users.find((u) => u.id === id);
ML.me = () => ML.user(ML.S.session);
ML.listing = (id) => ML.S.listings.find((l) => l.id === id);

// --- Demo authentication: stored in the browser only. Replace with Supabase Auth in production. ---
ML.login = function (email, pass, role) {
  const u = ML.S.users.find((x) => x.email === email.trim().toLowerCase() && x.pass === pass && x.role === role);
  if (!u) return false;
  ML.S.session = u.id; ML.save(); return true;
};
ML.logout = function () { ML.S.session = null; ML.save(); };
ML.register = function (d) {
  if (ML.S.users.some((u) => u.email === d.email)) return 'That email is already registered.';
  const u = Object.assign({ id: ML.uid('u') }, d); ML.S.users.push(u); ML.S.session = u.id; ML.save(); return null;
};
ML.HOME = { farmer: '/farmer', buyer: '/buyer', admin: '/admin' };

// --- Notifications: in-app only. SMS/email are simulated and labelled as such. `key` prevents duplicates. ---
ML.notify = function (uid, lid, type, title, msg, key, sms) {
  if (key && ML.S.notifs.some((n) => n.key === key)) return;
  ML.S.notifs.unshift({ id: ML.uid('n'), uid, lid, type, title, msg, key, sms: sms || '', channel: 'in-app', delivery: 'delivered in-app · SMS simulated', at: ML.iso(), read: false });
};

// --- Status changes are validated against ML.TRANSITIONS and logged ---
ML.setStatus = function (l, next, reason) {
  if (l.st === next) return true;
  if (!(ML.TRANSITIONS[l.st] || []).includes(next)) { ML.toast('Change from ' + l.st + ' to ' + next + ' is not allowed'); return false; }
  ML.S.history.push({ lid: l.id, from: l.st, to: next, reason, at: ML.iso() });
  l.st = next; l.upd = ML.iso(); return true;
};

</script>
  <script>
/* rules.js – freshness-risk rules, alert checker, workflow actions, search and ranking. */

// ---------- 1. Freshness estimate (transparent, rules-based, NOT a spoilage detector) ----------
ML.evalFresh = function (l) {
  if (l.type !== 'produce') return null;
  const days = ML.SHELF[l.crop];
  if (!days || !l.h) return { status: null, why: 'Condition check needed: no harvest date or no configured shelf-life for this crop, so no estimate is made.' };
  const win = days * (ML.STORAGE_FACTOR[l.stg] || 1), age = (ML.now() - new Date(l.h)) / ML.DAY, ratio = age / win;
  let status = ratio >= 1 ? 'URGENT_REVIEW' : ratio >= 0.85 ? 'AT_RISK' : ratio >= 0.6 ? 'ATTENTION' : 'FRESH';
  if (l.cond === 'deteriorating') status = 'URGENT_REVIEW';
  return { status, age, win, why: `ESTIMATE: harvested ${age.toFixed(1)} days ago, stored "${ML.STORAGE_LABEL[l.stg]}", configured window for ${l.crop} ≈ ${win.toFixed(1)} days (illustrative). FARMER-REPORTED condition: "${l.cond}". This is a rules-based estimate, not confirmed spoilage.` };
};

// ---------- 2. Alert checker (in production: run by a scheduled backend job; here: called on load and by demo tools) ----------
ML.runChecker = function () {
  let raised = 0;
  ML.S.listings.forEach((l) => {
    if (l.type !== 'produce' || l.draft || !['FRESH', 'ATTENTION', 'AT_RISK'].includes(l.st)) return;
    if (l.snooze && l.snooze > ML.now()) return;                       // farmer recently confirmed "still good"
    const e = ML.evalFresh(l);
    if (!e || !e.status || ML.RISK_ORDER[e.status] <= ML.RISK_ORDER[l.st]) return;
    if (!ML.setStatus(l, e.status, e.why)) return;
    raised++;
    const urgent = e.status === 'URGENT_REVIEW';
    ML.notify(l.sel, l.id, urgent ? 'confirm' : 'freshness', (urgent ? 'Please confirm condition: ' : 'Freshness alert: ') + l.title, e.why, `${l.id}:${e.status}:${l.cc}`, ML.smsFor(l, e.status)); // dedupe key
  });
  ML.save(); return raised;
};

// ---------- 3. Alternative-use workflow ----------
ML.flow = {
  stillGood(id) { const l = ML.listing(id); l.cond = 'good'; l.cc++; l.snooze = ML.now() + 2 * ML.DAY; if (l.st !== 'FRESH') ML.setStatus(l, 'FRESH', 'Farmer confirmed still suitable'); ML.save(); },
  notSuitable(id) {
    const l = ML.listing(id); l.cond = 'deteriorating';
    if (l.st !== 'URGENT_REVIEW') ML.setStatus(l, 'URGENT_REVIEW', 'Farmer reported deterioration');
    if (ML.setStatus(l, 'ALTERNATIVE_REVIEW', 'Farmer confirmed unsuitable for fresh sale')) {
      l.hidden = true; // withdrawn from the fresh marketplace
      ML.notify(l.sel, l.id, 'alternative', 'Alternative-use options ready', l.title + ' was withdrawn from fresh sale. Review safe alternatives.', null, 'MavunoLoop: ' + l.title + ' withdrawn from fresh sale. Do not sell it as food or feed. Open the app to review alternatives.');
    }
    ML.save();
  },
  createDraft(id) { // never published automatically
    const o = ML.listing(id), key = o.type === 'residue' ? o.crop : 'deteriorated produce', use = (ML.CATALOGUE[key] || ML.CATALOGUE['deteriorated produce'])[0][0];
    ML.S.listings.unshift({ id: ML.uid('l'), sel: o.sel, type: 'residue', crop: o.type === 'produce' ? o.crop + ' waste (not for food/feed)' : o.crop, title: o.crop + ' – ' + use, q: o.q, u: o.u, p: null, loc: o.loc, stg: 'ambient',
      cond: 'fair', st: 'ALTERNATIVE_LISTING', draft: true, hidden: false, reported: false, cc: 0, intended: use, avail: 'After you confirm', upd: ML.iso(), created: ML.iso(), origin: o.id });
    ML.save();
  },
  publish(id) { const d = ML.listing(id); d.draft = false; d.upd = ML.iso(); const o = ML.listing(d.origin); if (o) ML.setStatus(o, 'ALTERNATIVE_LISTING', 'Alternative listing published'); ML.save(); } };

// ---------- 4. Search & ranking (deterministic) ----------
ML.isVisible = (l) => !l.draft && !l.hidden && ['FRESH', 'ATTENTION', 'AT_RISK', 'AVAILABLE', 'ALTERNATIVE_LISTING'].includes(l.st);

ML.parseQuery = function (text) {   // rule-based fallback; an LLM can replace this on the server later
  const t = (text || '').toLowerCase(), o = { crop: null, loc: null, qty: null, unit: null, residue: false };
  for (const k in ML.ALIAS) if (ML.ALIAS[k].some((a) => new RegExp('\\b' + a + '\\b').test(t))) o.crop = k;
  o.loc = ML.PLACES.find((p) => t.includes(p.toLowerCase())) || null;
  const a = t.match(/(\d+)\s*(kg|bags?|crates?|sacks?|tonnes?)?/), b = t.match(/(bags?|crates?|sacks?|kg)\s*(\d+)/);
  if (a) { o.qty = +a[1]; o.unit = a[2] || null; } else if (b) { o.qty = +b[2]; o.unit = b[1]; }
  o.residue = /stalk|husk|cob|residue|mabua/.test(t);
  return o;
};

ML.score = function (l, q) {   // returns -1 when not relevant: urgency can never rescue an irrelevant listing
  const text = (q.text || '').toLowerCase();
  // Alternative-use listings (compost, biogas...) must not appear in searches for fresh produce
  if (l.st === 'ALTERNATIVE_LISTING' && !q.residue && !/compost|waste|biogas|residue/.test(text)) return -1;
  let rel = !text && !q.crop ? 1 : 0;
  if (q.crop && l.crop.includes(q.crop)) rel = 10;
  else if (text && (l.title + ' ' + l.crop).toLowerCase().split(/\W+/).some((w) => w.length > 3 && text.includes(w))) rel = 5;
  if (q.residue && l.type === 'residue') rel += 3;
  if (rel === 0) return -1;
  let s = rel * 5;
  if (q.loc && l.loc === q.loc) s += 20;                 // location match
  if (q.qty && l.q >= q.qty) s += 8;                      // enough quantity
  s += { AT_RISK: 14, ATTENTION: 7 }[l.st] || 0;          // urgency boost
  s += Math.max(0, 6 - (ML.now() - new Date(l.upd)) / ML.DAY); // recency
  return s;
};

ML.search = function (q) {
  return ML.S.listings.filter(ML.isVisible).map((l) => ({ l, s: ML.score(l, q) })).filter((x) => x.s >= 0)
    .filter((x) => (!q.type || x.l.type === q.type) && (!q.place || x.l.loc === q.place) && (!q.max || x.l.p == null || x.l.p <= q.max) && (!q.fresh || x.l.st === q.fresh))
    .sort((a, b) => q.sort === 'new' ? new Date(b.l.created) - new Date(a.l.created)
      : q.sort === 'urgent' ? ((ML.RISK_ORDER[b.l.st] || 0) - (ML.RISK_ORDER[a.l.st] || 0)) || b.s - a.s : b.s - a.s).map((x) => x.l);
};

// ---------- 5. Alert SMS text (SIMULATED – no SMS provider connected). Kept under ~160 characters ----------
ML.smsFor = function (l, status) {
  const lab = { ATTENTION: 'is nearing its selling window', AT_RISK: 'is at estimated risk', URGENT_REVIEW: 'needs a condition check' }[status] || 'needs attention';
  return `MavunoLoop: your ${l.crop} (${l.q}${l.u}) ${lab} (estimate). Check it now. Dial *384*88# then 3 to confirm. Reply STOP to opt out.`;
};

ML.pages.farmerForm = function (id, p) {

  return `<h1>${l ? 'Edit' : 'New'} ${type === 'produce' ? 'produce' : 'residue'} listing</h1>

    <label>Availability</label><input id="f_avail" value="${val('avail')}" placeholder="e.g. Ready this week"><label>Photo (optional, under 400 KB)</label><input id="f_img" type="file" accept="image/*">

ML.act.assist = function () {
  const c = ML.classify(document.getElementById('nl').value);

  ML.formPrefill = ML.prefillFrom(c);
  const t = c.kind === 'residue' ? 'residue' : 'produce';
  ML.toast('Detected: ' + t + '. Please check each field.');
  if (location.hash.startsWith('#/farmer/new?t=' + t)) ML.render(); else ML.go('/farmer/new?t=' + t);

ML.act.saveListing = function (ev, id, type) {
  ev.preventDefault(); const g = (i) => (document.getElementById(i) || {}).value, errs = [];
  const crop = (g('f_crop') || '').trim().toLowerCase(), q = +g('f_q'), loc = (g('f_loc') || '').trim(), price = g('f_p'), h = g('f_h');
  if (crop.length < 2) errs.push('Enter the crop or residue name.'); if (!(q > 0)) errs.push('Quantity must be more than 0.'); if (!loc) errs.push('Enter a location.');
  if (type === 'produce') { if (!h) errs.push('Harvest date is needed for freshness estimates.'); if (price === '') errs.push('Enter an asking price.'); }
  if (price !== '' && +price < 0) errs.push('Price cannot be negative.');
  if (errs.length) { document.getElementById('ferr').textContent = errs.join(' '); return false; }
  const finish = (img) => {
    const l = id ? ML.listing(id) : { id: ML.uid('l'), sel: ML.me().id, type, created: ML.iso(), draft: false, hidden: false, reported: false, cc: 0, st: type === 'produce' ? 'FRESH' : 'AVAILABLE' };
    Object.assign(l, { crop, title: crop[0].toUpperCase() + crop.slice(1) + (type === 'produce' ? ' – ' + loc : ''), q, u: g('f_u'), p: price === '' ? null : +price, loc, avail: g('f_avail'), cond: g('f_cond'), upd: ML.iso() });
    if (type === 'produce') { l.h = new Date(h).toISOString(); l.stg = g('f_stg'); } else l.intended = g('f_intended');

  };

  return false;
};

// ----- Freshness & alternative-use centre -----

    kind = 'residue'; const r = /stalk|mabua/.test(res) ? 'stalks' : /husk|makapi/.test(res) ? 'husks' : /cob/.test(res) ? 'cobs' : res.replace(/s$/, '') + 's';

ML.act.logout = () => { ML.logout(); ML.toast('Logged out'); };

ML.render = function () {
  const [path, qs] = (location.hash.slice(1) || '/').split('?'), query = new URLSearchParams(qs || ''), me = ML.me();
  document.title = 'MavunoLoop – Sell before it spoils';
  let html = '<div class="card">Page not found. <a href="#/">Go home</a></div>', routeName = '';
  for (const [pattern, role, fn] of ML.routes) {
    const params = matchRoute(pattern, path); if (!params) continue;
    if (role && !me) { ML.go(role === 'any' ? '/login/farmer' : '/login/' + role); return; }       // not logged in
    if (role && role !== 'any' && me.role !== role) { ML.toast('That page is for ' + role + 's'); ML.go(ML.HOME[me.role]); return; } // wrong role
    if (!role && /^\/(login|register)\//.test(pattern) && me) { ML.go(ML.HOME[me.role]); return; }                                 // already logged in
    html = fn(params, query); routeName = pattern.includes('ecard') ? 'ecard' : ''; break;
  }
  renderNav(path); document.getElementById('app').innerHTML = html; window.scrollTo(0, 0);
  if (ML.afterRender) ML.afterRender(routeName);
};

window.addEventListener('hashchange', ML.render);
ML.runChecker();
ML.render();
ML.chat.init();
ML.floaters();

</script>
